[project]
name = "formwise-api"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.4,<26",
    "firebase-admin>=7.1,<8",
    "httpx>=0.28,<1",
    "formwise-document-core",
    "formwise-worker",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
formwise-document-core = { workspace = true }
formwise-worker = { workspace = true }

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(), Query(), Path(), Header(), Body() etc. are safe to use
# as default argument values - they are evaluated by FastAPI's DI system, not
# at import time.  Listing them here suppresses B008 for these patterns across
# all files without needing per-file ignores.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "Depends",
    "Query",
    "Path",
    "Header",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
mypy_path = ["services/worker/src", "packages/document-core/python/src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# firebase-admin does not ship py.typed or stub packages.
# All firebase_admin calls in our code are routed through thin typed wrappers;
# allowing untyped imports here is the least-invasive fix.
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF (fitz) does not ship py.typed or official stubs.
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# In-workspace packages whose internal type errors should be ignored during API check.
module = ["formwise_document_core", "formwise_document_core.*", "formwise_worker", "formwise_worker.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]

