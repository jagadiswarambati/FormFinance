[project]
name = "formwise-ai-workspace"
version = "0.1.0"
description = "FormWise AI development workspace"
requires-python = ">=3.13"
dependencies = [
    "formwise-api",
    "formwise-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/api",
    "services/worker",
    "packages/document-core/python",
]

[tool.uv.sources]
formwise-api = { workspace = true }
formwise-worker = { workspace = true }
formwise-document-core = { workspace = true }
